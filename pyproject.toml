[project]
name = "rag-agent"
version = "0.1.0"
description = "Agentic RAG system: LangChain agent + LlamaIndex ingestion + Qdrant + LiteLLM, served via FastAPI, Dash UI, orchestrated with Dagster"
readme = "README.md"
authors = [
    { name = "georgmangithub" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rag-agent = "rag_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
